name: Qaama
options:
  bundleIdPrefix: fr.michaelperrin
  deploymentTarget:
    macOS: "27.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # Extract SwiftUI string literals into the String Catalog so other languages can be added later.
    SWIFT_EMIT_LOC_STRINGS: YES
    # Ad hoc signing: enough for local runs with a free developer account.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  LibraryKit:
    path: Packages/LibraryKit
  EditModel:
    path: Packages/EditModel
  EditorKit:
    path: Packages/EditorKit
  ImageIOKit:
    path: Packages/ImageIOKit
  RenderEngine:
    path: Packages/RenderEngine

targets:
  Qaama:
    type: application
    platform: macOS
    sources:
      - path: Qaama
    dependencies:
      - package: LibraryKit
      - package: EditModel
      - package: EditorKit
      - package: ImageIOKit
      - package: RenderEngine
    info:
      path: Qaama/Info.plist
      properties:
        CFBundleDisplayName: Qaama
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "27.0"
        NSPhotoLibraryUsageDescription: Qaama needs access to your photo library to browse and edit your photos.
        NSHumanReadableCopyright: "© 2026 Michaël Perrin"
    entitlements:
      path: Qaama/Qaama.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.michaelperrin.qaama
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Qaama:
    build:
      targets:
        Qaama: all
    run:
      config: Debug
